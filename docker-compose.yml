# Local PostgreSQL for development and tests.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: dealership-postgres
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
      POSTGRES_DB: dealership
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
